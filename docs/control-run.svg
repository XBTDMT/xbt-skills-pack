<line class="grid" x1="50" x2="1150" y1="672" y2="672"/>
<text class="note" x="50" y="706">Highlighted rows are the only ones that move: what the session leaves behind, not what it scores. Every named skill loaded when asked (receipt 6 of 6, close-out 3 of 3, decision skill 3 of 3);</text>
<text class="note" x="50" y="725">the side-buddy skill cannot be invoked by the model by design, so its typed effect is unmeasured here. Costs from each session's own transcript record. Scored by script inside each repo.</text>
</svg>