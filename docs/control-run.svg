<text class="tdn" x="710" y="185" text-anchor="middle">3 of 3</text>
<text class="tdn" x="890" y="185" text-anchor="middle">2 of 3</text>
<text class="tdn" x="1070" y="185" text-anchor="middle">2 of 3</text>
