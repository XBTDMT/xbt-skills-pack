<text class="note" x="50" y="786">Highlighted cells are the ones that move: what the session leaves behind, not what it scores. Every named skill loaded when asked</text>
<text class="note" x="50" y="805">(receipt 6 of 6, close-out 3 of 3, decision skill 3 of 3, redman 6 of 6 when typed). Redman's file-every-finding rule met the audit's "do not edit anything":</text>
<text class="note" x="50" y="824">two sessions held the findings and said why, one filed and failed. Costs from each session's own transcript record; the cost row is the two tasks the typed arm ran.</text>
