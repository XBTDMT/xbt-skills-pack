<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="ct cd">
<title id="ct">The skills control run: absent, present, invoked</title>
<desc id="cd">A table of counts per cell for four held-out tasks run three times each in three arms: the skills absent from the session, the skills installed but never invoked, and the skills invoked by the prompt. Outcome counts are level across the arms; the invoked arm alone leaves a handoff, an overview, a re-derived pin, a named source and a decision record behind, at $32.78 against $29.30 and $22.16.</desc>
<style>
:root { --bg:#fbfaf7; --ink:#1d1d1f; --muted:#7a7a80; --line:#e0ddd5; --grid:#edebe5; --hi:#eef2ff; --fable:#b03a5b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d; --hi:#232a45; --fable:#e0708f; }
}
:root[data-theme="dark"] { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d; --hi:#232a45; --fable:#e0708f; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.bg { fill: var(--bg); } .h { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; } .sub { font-size: 14px; fill: var(--muted); }
.th { font-size: 14px; font-weight: 650; } .thm { font-size: 12.5px; fill: var(--muted); } .td { font-size: 14.5px; } .tdn { font-size: 14.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.tdd { font-size: 14.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; fill: var(--fable); }
.rule { stroke: var(--line); stroke-width: 1.5; } .grid { stroke: var(--grid); stroke-width: 1; } .hi { fill: var(--hi); } .note { font-size: 12.5px; fill: var(--muted); }
</style>
<rect class="bg" x="0" y="0" width="1200" height="850" rx="14"/>
<text class="h" x="50" y="52">Do the skills change outcomes? Absent, installed, invoked, and redman typed — four tasks, three runs each.</text>
<text class="sub" x="50" y="78">Fable 5.1 low, doctrine off in every arm, one fresh session per task, counts per cell. 42 sessions, 22 September 2026; the typed arm ran two tasks.</text>
<text class="th" x="50" y="130">Task</text>
<text class="th" x="590" y="122" text-anchor="middle">Skills absent</text><text class="thm" x="590" y="140" text-anchor="middle">removed from the session</text>
<text class="th" x="750" y="122" text-anchor="middle">Skills present</text><text class="thm" x="750" y="140" text-anchor="middle">installed, not called</text>
<text class="th" x="910" y="122" text-anchor="middle">Skills invoked</text><text class="thm" x="910" y="140" text-anchor="middle">the prompt calls them</text>
<text class="th" x="1070" y="122" text-anchor="middle">Redman typed</text><text class="thm" x="1070" y="140" text-anchor="middle">/redman first, then the task</text>
<line class="rule" x1="50" x2="1150" y1="152" y2="152"/>
