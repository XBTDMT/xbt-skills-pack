<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1156" width="1200" height="1156" role="img" aria-labelledby="fzt fzd">
<title id="fzt">The cheap end: the sixteen runs that cost under $30 for the nine tasks</title>
<desc id="fzd">The cheap end of the correctness-and-cost chart, zoomed: the 16 runs that cost under $30 for the nine tasks. Opus 5 high: 92 at $25.17 without a page, 97 at $27.41 with one (+4.9, better). Fable 5.1 low: 90 at $18.85 without a page, 98 at $20.17 with one (+8.2, better). Fable 5.1 medium: 93 at $21.25 without a page, 97 at $21.70 with one (+3.5, better, just past the 3-point rule). Opus 5.5 medium: 93 at $10.30 without a page, 96 at $11.54 with one (+3.2, better, just past the 3-point rule); on the Opus 5 page 95 at $11.03. Opus 5.5 high: 95 at $14.94 without a page, 98 at $13.98 with one (+3.0, level within noise); on the Opus 5 page 96 at $13.32. Sonnet 5.5 high: 92 at $5.19 without a page, 96 at $8.38 with one (+3.4, better, just past the 3-point rule); a first pass, 30 September and 5 October, without a page 93 at $5.88; on the Opus 5 page 93 at $6.87. Noise: one setup run twice side by side moved by up to 2.7 points, so a gap of 3 points or less is level within noise. One fresh session per task. How the pairs ran: Sonnet 5.5 high and max (both passes) ran without and with a page side by side, task by task (Sonnet 5.5 high and max, first pass, over 30 September and 5 October); Opus 5 max on the same day, at overlapping times; Fable 5.1 low and medium and Opus 5.5 medium, high and max on the same day, one after the other; Opus 5 high without a page over 2–3 September (Oracle migrate, No-change and Wide audit on 2 September, the other six on 3 September at overlapping times with the run with a page), with one on 3 September; Sonnet 5 max (2 September without a page, 3 September with one) on different days. Runs on different days moved up to 4.2: Sonnet 5.5 max without a page scored 92.9 (its tasks split between 30 September and 5 October) and 88.7 (on 5 October), 4.2 points apart. Pages: Opus 5, Fable 5.1 and Sonnet 5 (the last on the Opus 5 page) ran the first pages on 2–3 September 2026 (rescored on 22 September); Opus 5.5 ran its 22 September page and the Opus 5 page of 15 September on 22 September; Sonnet 5.5 ran the Opus 5.5 page of 29 September on 5 October, after a first pass without a page and on the Opus 5 page on 30 September and 5 October. Opus 5.5 high, repeated on its page: 96.4 (97.6 here); medium, run again on the revised 22 September page: 95.3, 2 agents. The pages that ship since 7 October were measured only on the held-out set.</desc>
