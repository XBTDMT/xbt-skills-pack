<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 3296" width="470" height="2582" role="img" aria-labelledby="hw-t hw-d">
<title id="hw-t">How xbt-skills-pack works: start, work, finish, and the project documents they share</title>
<desc id="hw-d">Three phases of a Claude Code session and the project documents they share. Start: read the pin and the handoff; the optional doctrine hook; the optional cc seats on Windows (cc, cc opus, cc fable, cc sonnet, cc skills, cc default). Work: greenman, always on; /redman, manual, for big projects; /eli5, a plain-English receipt after every substantial turn; the doc check at the end of every turn; the Apple references. Finish: /closeout, /project-update, the per-project commit gate and /doc-guardrails. The project's own documents: the roadmap (the hub), the pin, the handoff, the brain file, the ledger, the decisions and the overview. An arrow runs from the documents back to the start: the next session starts from the pin and the handoff. Underneath: closeout.py, turn_check.py, receipt_check.py, skill_fresh.py and the optional doctrine's brief.py.</desc>
<style>
:root { --bg:#fbfaf7; --ink:#1d1d1f; --muted:#5c5c63; --card:#ffffff; --border:#8a877f; --accent:#3b5bdb; --soft:#eef2ff; --hubink:#ffffff; --green:#2f7d4f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#16171a; --ink:#ececef; --muted:#a6a6ae; --card:#1f2024; --border:#70727a; --accent:#7c9bff; --soft:#232a45; --hubink:#0f1320; --green:#6cc494; }
}
:root[data-theme="dark"] { --bg:#16171a; --ink:#ececef; --muted:#a6a6ae; --card:#1f2024; --border:#70727a; --accent:#7c9bff; --soft:#232a45; --hubink:#0f1320; --green:#6cc494; }
text { font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, "Liberation Sans", sans-serif; fill: var(--ink); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", "Courier New", monospace; }
.bg { fill: var(--bg); }
.title { font-size: 40px; font-weight: 700; letter-spacing: -0.3px; }
.sub { font-size: 24px; fill: var(--muted); }
.phase { font-size: 22px; font-weight: 700; letter-spacing: 1.5px; fill: var(--accent); }
.phase-sub { font-size: 22px; font-weight: 400; letter-spacing: 0; fill: var(--muted); }
.card { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
.name { font-size: 26px; font-weight: 650; }
.opt { font-size: 21.5px; font-weight: 700; fill: var(--muted); letter-spacing: .4px; }
.on { font-size: 21.5px; font-weight: 700; fill: var(--green); letter-spacing: .4px; }
.desc { font-size: 22px; fill: var(--muted); }
.flow { stroke: var(--accent); stroke-width: 3; fill: none; }
.head { fill: var(--accent); }
.tick { stroke: var(--accent); stroke-width: 2.8; stroke-dasharray: 5 7; }
.band { fill: var(--soft); stroke: var(--border); stroke-width: 1.2; }
.chip { fill: var(--card); stroke: var(--border); stroke-width: 1.2; }
.hub { fill: var(--accent); }
.chip-name { font-size: 23px; font-weight: 650; }
.chip-role { font-size: 21.5px; font-weight: 400; fill: var(--muted); }
.hub-name { font-size: 23px; font-weight: 700; fill: var(--hubink); }
.hub-role { font-size: 21.5px; font-weight: 400; fill: var(--hubink); }
.caption { font-size: 22px; fill: var(--muted); }
.foot { font-size: 21.5px; fill: var(--muted); }
</style>
<rect class="bg" x="0" y="0" width="600" height="3296" rx="18"/>
<text class="title" x="40" y="80">xbt-skills-pack</text>
<text class="sub" x="40" y="112.6">Claude Code skills that keep a</text>
<text class="sub" x="40" y="145.2">project honest, from the first</text>
<text class="sub" x="40" y="177.8">session to the handoff.</text>
<text class="phase" x="42" y="229.8">1 · START<tspan class="phase-sub" dx="12">a session opens</tspan></text>
<rect class="card" x="40" y="243.8" width="520" height="554.5" rx="14"/>
<text class="name" x="64" y="293.8">Read the pin and the handoff</text>
<text class="desc" x="64" y="323.7">The pin says where things stand; the</text>
<text class="desc" x="64" y="353.6">handoff says what to do next.</text>
<text class="name" x="64" y="399.5">Doctrine hook<tspan class="opt" dx="10">OPTIONAL</tspan></text>
<text class="desc" x="64" y="429.4">Working rules for every session:</text>
<text class="desc" x="64" y="459.3">stay in scope, show proof before</text>
<text class="desc" x="64" y="489.2">“done”, push back once when a</text>
<text class="desc" x="64" y="519.1">request looks wrong, never work</text>
<text class="desc" x="64" y="549">around a permission you refused.</text>
<text class="name" x="64" y="594.9"><tspan class="mono">cc</tspan> seats<tspan class="opt" dx="10">OPTIONAL · WINDOWS</tspan></text>
<text class="desc" x="64" y="624.8"><tspan class="mono">cc</tspan> the engineer</text>
<text class="desc" x="64" y="654.7"><tspan class="mono">cc opus</tspan> the reviewer</text>
<text class="desc" x="64" y="684.6"><tspan class="mono">cc fable</tspan> Fable 5.1</text>
<text class="desc" x="64" y="714.5"><tspan class="mono">cc sonnet</tspan> the helper</text>
<text class="desc" x="64" y="744.4"><tspan class="mono">cc skills</tspan> no doctrine</text>
<text class="desc" x="64" y="774.3"><tspan class="mono">cc default</tspan> stock Claude Code</text>
<path class="flow" d="M300 804.3 V816.3"/>
<path class="head" d="M300 832.3 l-10.8 -18 h21.6 z"/>
<text class="phase" x="42" y="864.3">2 · WORK<tspan class="phase-sub" dx="12">while you build</tspan></text>
<rect class="card" x="40" y="878.3" width="520" height="616.4" rx="14"/>
<text class="name" x="64" y="928.3">greenman<tspan class="on" dx="10">ALWAYS ON</tspan></text>
<text class="desc" x="64" y="958.2">A real choice: routes that differ,</text>
<text class="desc" x="64" y="988.1">the shortcut rejected, the call</text>
<text class="desc" x="64" y="1018">written down.</text>
<text class="name" x="64" y="1063.9"><tspan class="mono">/redman</tspan><tspan class="opt" dx="10">MANUAL · BIG PROJECTS</tspan></text>
<text class="desc" x="64" y="1093.8">A failed step says why and what it</text>
<text class="desc" x="64" y="1123.7">served; side findings are sized</text>
<text class="desc" x="64" y="1153.6">and filed.</text>
<text class="name" x="64" y="1199.5"><tspan class="mono">/eli5</tspan></text>
<text class="desc" x="64" y="1229.4">A plain-English receipt after every</text>
<text class="desc" x="64" y="1259.3">substantial turn.</text>
<text class="name" x="64" y="1305.2">doc check<tspan class="on" dx="10">END OF EVERY TURN</tspan></text>
<text class="desc" x="64" y="1335.1">Every document this session wrote,</text>
<text class="desc" x="64" y="1365">whatever wrote it: does it name its</text>
<text class="desc" x="64" y="1394.9">roadmap item?</text>
<text class="desc" x="64" y="1440.8">+ Apple references that turn on</text>
<text class="desc" x="64" y="1470.7">by themselves</text>
<path class="flow" d="M300 1500.7 V1512.7"/>
<path class="head" d="M300 1528.7 l-10.8 -18 h21.6 z"/>
<text class="phase" x="42" y="1560.7">3 · FINISH<tspan class="phase-sub" dx="12">something is done</tspan></text>
<rect class="card" x="40" y="1574.7" width="520" height="570.5" rx="14"/>
<text class="name" x="64" y="1624.7"><tspan class="mono">/closeout</tspan></text>
<text class="desc" x="64" y="1654.6">Prove it, update the docs, carry</text>
<text class="desc" x="64" y="1684.5">findings and decisions into the</text>
<text class="desc" x="64" y="1714.4">plan, write the handoff and</text>
<text class="desc" x="64" y="1744.3">overview, audit, commit.</text>
<text class="name" x="64" y="1790.2"><tspan class="mono">/project-update</tspan></text>
<text class="desc" x="64" y="1820.1">Nothing closed yet: make every</text>
<text class="desc" x="64" y="1850">document match the project as it</text>
<text class="desc" x="64" y="1879.9">is now.</text>
<text class="name" x="64" y="1925.8">commit gate<tspan class="opt" dx="10">PER PROJECT</tspan></text>
<text class="desc" x="64" y="1955.7">Staged documents checked at every</text>
<text class="desc" x="64" y="1985.6">commit; a warning, or a refusal if</text>
<text class="desc" x="64" y="2015.5">the project says so.</text>
<text class="name" x="64" y="2061.4"><tspan class="mono">/doc-guardrails</tspan></text>
<text class="desc" x="64" y="2091.3">On demand: every document not</text>
<text class="desc" x="64" y="2121.2">yet linked.</text>
<line class="tick" x1="300" y1="2145.2" x2="300" y2="2197.2"/>
<rect class="band" x="40" y="2197.2" width="520" height="624.8" rx="14"/>
<text class="phase" x="64" y="2243.2">THE PROJECT’S OWN DOCS</text>
<text class="phase-sub" x="64" y="2273.1">in the project’s own folders; each</text>
<text class="phase-sub" x="64" y="2303">skill reads and writes them; every</text>
<text class="phase-sub" x="64" y="2332.9">one links to the roadmap</text>
<rect class="hub" x="64" y="2350.9" width="472" height="55.3" rx="10"/>
<text class="hub-name" x="80" y="2384.75">Roadmap<tspan class="hub-role" dx="14">the plan · the hub</tspan></text>
<rect class="chip" x="64" y="2416.2" width="472" height="55.3" rx="10"/>
<text class="chip-name" x="80" y="2450.05">Pin<tspan class="chip-role" dx="14">where things stand</tspan></text>
<rect class="chip" x="64" y="2481.5" width="472" height="55.3" rx="10"/>
<text class="chip-name" x="80" y="2515.35">Handoff<tspan class="chip-role" dx="14">what to do next</tspan></text>
<rect class="chip" x="64" y="2546.8" width="472" height="55.3" rx="10"/>
<text class="chip-name" x="80" y="2580.65">Brain<tspan class="chip-role" dx="14">lessons learned</tspan></text>
<rect class="chip" x="64" y="2612.1" width="472" height="55.3" rx="10"/>
<text class="chip-name" x="80" y="2645.95">Ledger<tspan class="chip-role" dx="14">redman’s findings</tspan></text>
<rect class="chip" x="64" y="2677.4" width="472" height="55.3" rx="10"/>
<text class="chip-name" x="80" y="2711.25">Decisions<tspan class="chip-role" dx="14">greenman’s calls</tspan></text>
<rect class="chip" x="64" y="2742.7" width="472" height="55.3" rx="10"/>
<text class="chip-name" x="80" y="2776.55">Overview<tspan class="chip-role" dx="14">one HTML page</tspan></text>
<path class="flow" d="M300 2822 V2852 H20 V283.8 H24"/>
<path class="head" d="M40 283.8 l-18 -10.8 v21.6 z"/>
<text class="caption" x="50" y="2881.9">the next session starts from the pin</text>
<text class="caption" x="50" y="2911.8">and the handoff, so nothing is lost</text>
<text class="caption" x="50" y="2941.7">between threads</text>
<text class="foot" x="40" y="2992.9">Underneath, plain Python on Windows,</text>
<text class="foot" x="40" y="3022.1">macOS and Linux (GPL-3.0-or-later):</text>
<text class="foot" x="40" y="3051.3"><tspan class="mono">closeout.py</tspan> (facts · audit · link-audit</text>
<text class="foot" x="40" y="3080.5">· install-gate) and <tspan class="mono">turn_check.py</tspan>;</text>
<text class="foot" x="40" y="3109.7"><tspan class="mono">receipt_check.py</tspan> holds a turn whose</text>
<text class="foot" x="40" y="3138.9">receipt is missing or out of shape while</text>
<text class="foot" x="40" y="3168.1"><tspan class="mono">/eli5</tspan> is on, <tspan class="mono">skill_fresh.py</tspan> says when a</text>
<text class="foot" x="40" y="3197.3">loaded skill changed on disk, and the</text>
<text class="foot" x="40" y="3226.5">optional doctrine’s <tspan class="mono">brief.py</tspan> gives every</text>
<text class="foot" x="40" y="3255.7">agent the key rules as it starts.</text>
</svg>
