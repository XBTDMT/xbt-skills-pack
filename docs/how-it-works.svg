<rect class="bg" x="0" y="0" width="1200" height="1199" rx="18"/>
<text class="title" x="30" y="64">xbt-skills-pack</text>
<text class="sub" x="30" y="89.8">Claude Code skills that keep a project honest, from the first session to the handoff.</text>
<text class="phase" x="32" y="129.8">1 · START<tspan class="phase-sub" dx="12">a session opens</tspan></text>
<text class="phase" x="432" y="129.8">2 · WORK<tspan class="phase-sub" dx="12">while you build</tspan></text>
<text class="phase" x="832" y="129.8">3 · FINISH<tspan class="phase-sub" dx="12">something is done</tspan></text>
<rect class="card" x="30" y="143.8" width="340" height="529.1" rx="14"/>
<text class="name" x="52" y="185.3">Read the pin and</text>
<text class="name" x="52" y="211.8">the handoff</text>
<text class="desc" x="52" y="234.9">The pin says where things</text>
<text class="desc" x="52" y="258">stand; the handoff says what</text>
<text class="desc" x="52" y="281.1">to do next.</text>
<text class="name" x="52" y="316.2">Doctrine hook<tspan class="opt" dx="10">OPTIONAL</tspan></text>
<text class="desc" x="52" y="339.3">Working rules for every</text>
<text class="desc" x="52" y="362.4">session: stay in scope, show</text>
<text class="desc" x="52" y="385.5">proof before “done”, push back</text>
<text class="desc" x="52" y="408.6">once when a request looks</text>
<text class="desc" x="52" y="431.7">wrong, never work around a</text>
<text class="desc" x="52" y="454.8">permission you refused.</text>
<text class="name" x="52" y="489.9"><tspan class="mono">cc</tspan> seats</text>
<text class="opt" x="52" y="512.3">OPTIONAL · WINDOWS</text>
<text class="desc" x="52" y="535.4"><tspan class="mono">cc</tspan> the engineer</text>
<text class="desc" x="52" y="558.5"><tspan class="mono">cc opus</tspan> the reviewer</text>
<text class="desc" x="52" y="581.6"><tspan class="mono">cc fable</tspan> Fable 5.1</text>
<text class="desc" x="52" y="604.7"><tspan class="mono">cc sonnet</tspan> the helper</text>
<text class="desc" x="52" y="627.8"><tspan class="mono">cc skills</tspan> no doctrine</text>
<text class="desc" x="52" y="650.9"><tspan class="mono">cc default</tspan> stock Claude Code</text>
<path class="flow" d="M380 408.35 H409"/>
<path class="head" d="M420 408.35 l-13 -7.8 v15.6 z"/>
<rect class="card" x="430" y="143.8" width="340" height="529.1" rx="14"/>
<text class="name" x="452" y="185.3">greenman<tspan class="on" dx="10">ALWAYS ON</tspan></text>
<text class="desc" x="452" y="208.4">A real choice: routes that</text>
<text class="desc" x="452" y="231.5">differ, the shortcut rejected,</text>
<text class="desc" x="452" y="254.6">the call written down.</text>
<text class="name" x="452" y="289.7"><tspan class="mono">/redman</tspan></text>
<text class="opt" x="452" y="312.1">MANUAL · BIG PROJECTS</text>
<text class="desc" x="452" y="335.2">A failed step says why and</text>
<text class="desc" x="452" y="358.3">what it served; side findings</text>
<text class="desc" x="452" y="381.4">are sized and filed.</text>
<text class="name" x="452" y="416.5"><tspan class="mono">/eli5</tspan></text>
<text class="desc" x="452" y="439.6">A plain-English receipt after</text>
<text class="desc" x="452" y="462.7">every substantial turn.</text>
<text class="name" x="452" y="497.8">doc check</text>
<text class="on" x="452" y="520.2">END OF EVERY TURN</text>
<text class="desc" x="452" y="543.3">Every document this session</text>
<text class="desc" x="452" y="566.4">wrote, whatever wrote it: does</text>
<text class="desc" x="452" y="589.5">it name its roadmap item?</text>
<text class="desc" x="452" y="624.6">+ Apple references that turn</text>
<text class="desc" x="452" y="647.7">on by themselves</text>
<path class="flow" d="M780 408.35 H809"/>
<path class="head" d="M820 408.35 l-13 -7.8 v15.6 z"/>
<rect class="card" x="830" y="143.8" width="340" height="529.1" rx="14"/>
<text class="name" x="852" y="185.3"><tspan class="mono">/closeout</tspan></text>
<text class="desc" x="852" y="208.4">Prove it, update the docs,</text>
<text class="desc" x="852" y="231.5">carry findings and decisions</text>
<text class="desc" x="852" y="254.6">into the plan, write the</text>
<text class="desc" x="852" y="277.7">handoff and overview,</text>
<text class="desc" x="852" y="300.8">audit, commit.</text>
<text class="name" x="852" y="335.9"><tspan class="mono">/project-update</tspan></text>
<text class="desc" x="852" y="359">Nothing closed yet: make every</text>
<text class="desc" x="852" y="382.1">document match the project as</text>
<text class="desc" x="852" y="405.2">it is now.</text>
<text class="name" x="852" y="440.3">commit gate<tspan class="opt" dx="10">PER PROJECT</tspan></text>
<text class="desc" x="852" y="463.4">Staged documents checked at</text>
<text class="desc" x="852" y="486.5">every commit; a warning, or a</text>
<text class="desc" x="852" y="509.6">refusal if the project</text>
<text class="desc" x="852" y="532.7">says so.</text>
<text class="name" x="852" y="567.8"><tspan class="mono">/doc-guardrails</tspan></text>
<text class="desc" x="852" y="590.9">On demand: every document not</text>
<text class="desc" x="852" y="614">yet linked.</text>
<line class="tick" x1="200" y1="672.9" x2="200" y2="716.9"/>
<line class="tick" x1="600" y1="672.9" x2="600" y2="716.9"/>
<line class="tick" x1="1000" y1="672.9" x2="1000" y2="716.9"/>
<rect class="band" x="30" y="716.9" width="1140" height="284.9" rx="14"/>
<text class="phase" x="52" y="755.9">THE PROJECT’S OWN DOCS</text>
<text class="phase-sub" x="52" y="779">in the project’s own folders; each skill reads and writes them; every one links to the roadmap</text>
<rect class="hub" x="52" y="797" width="263.5" height="84.4" rx="10"/>
<text class="hub-name" x="68" y="833.4">Roadmap</text>
<text class="hub-role" x="68" y="855.8">the plan · the hub</text>
<rect class="chip" x="329.5" y="797" width="263.5" height="84.4" rx="10"/>
<text class="chip-name" x="345.5" y="833.4">Pin</text>
<text class="chip-role" x="345.5" y="855.8">where things stand</text>
<rect class="chip" x="607" y="797" width="263.5" height="84.4" rx="10"/>
<text class="chip-name" x="623" y="833.4">Handoff</text>
<text class="chip-role" x="623" y="855.8">what to do next</text>
<rect class="chip" x="884.5" y="797" width="263.5" height="84.4" rx="10"/>
<text class="chip-name" x="900.5" y="833.4">Brain</text>
<text class="chip-role" x="900.5" y="855.8">lessons learned</text>
<rect class="chip" x="52" y="895.4" width="263.5" height="84.4" rx="10"/>
<text class="chip-name" x="68" y="931.8">Ledger</text>
<text class="chip-role" x="68" y="954.2">redman’s findings</text>
<rect class="chip" x="329.5" y="895.4" width="263.5" height="84.4" rx="10"/>
<text class="chip-name" x="345.5" y="931.8">Decisions</text>
<text class="chip-role" x="345.5" y="954.2">greenman’s calls</text>
<rect class="chip" x="607" y="895.4" width="263.5" height="84.4" rx="10"/>
<text class="chip-name" x="623" y="931.8">Overview</text>
<text class="chip-role" x="623" y="954.2">one HTML page</text>
<path class="flow" d="M600 1001.8 V1031.8 H15 V408.35 H19"/>
<path class="head" d="M30 408.35 l-13 -7.8 v15.6 z"/>
<text class="caption" x="40" y="1054.9">the next session starts from the pin and the handoff, so nothing is lost between threads</text>
<text class="foot" x="30" y="1100">Underneath, plain Python on Windows, macOS and Linux (MIT): <tspan class="mono">closeout.py</tspan> (facts · audit · link-audit ·</text>
<text class="foot" x="30" y="1123.1">install-gate) and <tspan class="mono">turn_check.py</tspan>; <tspan class="mono">receipt_check.py</tspan> holds a turn whose receipt is missing or out of shape while</text>
<text class="foot" x="30" y="1146.2"><tspan class="mono">/eli5</tspan> is on, <tspan class="mono">skill_fresh.py</tspan> says when a loaded skill changed on disk, and the optional doctrine’s <tspan class="mono">brief.py</tspan> gives</text>
<text class="foot" x="30" y="1169.3">every agent the key rules as it starts.</text>
</svg>
