<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="mt md">
  <title id="mt">The doctrine layer, measured with it and without it</title>
  <desc id="md">A scatter chart of correctness against cost for nine held-out tasks. Each model configuration appears twice, joined by a line: a filled dot with the doctrine layer and a hollow dot without it. Fable 5.1 low goes from 86 correct at $18.85 bare to 94 at $20.17 with the layer. Opus 5 high goes from 92 at $25.17 to 97 at $27.41. Fable 5.1 medium goes from 91 at $21.25 to 94 at $21.70. Opus 5 max goes from 91 at $36.99 to 92 at $83.75, because the layer's agent opt-in spawned eighteen agents. Sonnet 5 max goes the wrong way: from 90 at $32.75 bare down to 87 at $38.86 with the layer.</desc>
  <style>
    :root { --bg:#fbfaf7; --ink:#1d1d1f; --muted:#7a7a80; --line:#e0ddd5; --grid:#edebe5;
            --opus:#3b5bdb; --fable:#b03a5b; --sonnet:#b07d2a; --link:#b8b5ad; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d;
            --opus:#7c9bff; --fable:#e0708f; --sonnet:#d9a441; --link:#4a4c53; }
    }
    :root[data-theme="dark"] { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d;
            --opus:#7c9bff; --fable:#e0708f; --sonnet:#d9a441; --link:#4a4c53; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .h { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
    .sub { font-size: 14px; fill: var(--muted); }
    .axlabel { font-size: 12.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tick { font-size: 12.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-size: 14.5px; font-weight: 600; }
    .note { font-size: 12.5px; fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .link { stroke: var(--link); stroke-width: 1.5; }
    .legend { font-size: 13px; fill: var(--ink); }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="820" rx="14"/>

  <text class="h" x="50" y="52">Does the doctrine layer help? Nine tasks, 74 fresh sessions, with it and without it.</text>
  <text class="sub" x="50" y="78">Each configuration appears twice, joined by a line: filled = with the layer, hollow = bare. Up is better, left is cheaper.</text>

  <!-- grid: y 84..100 (690..130), x $0..$90 (140..1150) -->
  <g>
    <line class="grid" x1="140" y1="130" x2="1150" y2="130"/>
    <line class="grid" x1="140" y1="270" x2="1150" y2="270"/>
    <line class="grid" x1="140" y1="410" x2="1150" y2="410"/>
    <line class="grid" x1="140" y1="550" x2="1150" y2="550"/>
    <line class="axis" x1="140" y1="690" x2="1150" y2="690"/>
    <line class="axis" x1="140" y1="130" x2="140" y2="690"/>
    <text class="tick" x="126" y="135" text-anchor="end">100</text>
    <text class="tick" x="126" y="275" text-anchor="end">96</text>
    <text class="tick" x="126" y="415" text-anchor="end">92</text>
    <text class="tick" x="126" y="555" text-anchor="end">88</text>
    <text class="tick" x="126" y="695" text-anchor="end">84</text>
    <text class="axlabel" x="140" y="112">correctness, nine tasks</text>
    <text class="tick" x="140" y="714" text-anchor="middle">$0</text>
    <text class="tick" x="364" y="714" text-anchor="middle">$20</text>
    <text class="tick" x="589" y="714" text-anchor="middle">$40</text>
    <text class="tick" x="813" y="714" text-anchor="middle">$60</text>
    <text class="tick" x="1038" y="714" text-anchor="middle">$80</text>
    <text class="axlabel" x="1150" y="736" text-anchor="end">total cost of the nine tasks</text>
  </g>

  <!-- pairs -->
  <g>
    <!-- Fable 5.1 low: bare 86 @18.85 -> layer 94 @20.17 -->
    <line class="link" x1="351" y1="620" x2="366" y2="340"/>
    <circle cx="351" cy="620" r="8" fill="var(--bg)" stroke="var(--fable)" stroke-width="2.5"/>
    <circle cx="366" cy="340" r="8" fill="var(--fable)"/>
    <text class="name" x="356" y="322" text-anchor="end">Fable 5.1 low</text>
    <text class="note" x="356" y="338" text-anchor="end">86 → 94</text>

    <!-- Fable 5.1 medium: bare 91 @21.25 -> layer 94 @21.70 -->
    <line class="link" x1="378" y1="445" x2="384" y2="340"/>
    <circle cx="378" cy="445" r="8" fill="var(--bg)" stroke="var(--fable)" stroke-width="2.5"/>
    <circle cx="384" cy="340" r="8" fill="var(--fable)"/>
    <text class="name" x="400" y="336">Fable 5.1 medium</text>
    <text class="note" x="400" y="352">91 → 94</text>

    <!-- Opus 5 high: bare 92 @25.17 -> doctrine 97 @27.41 -->
    <line class="link" x1="422" y1="410" x2="448" y2="235"/>
    <circle cx="422" cy="410" r="8" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/>
    <circle cx="448" cy="235" r="8" fill="var(--opus)"/>
    <text class="name" x="466" y="231">Opus 5 high</text>
    <text class="note" x="466" y="247">92 → 97 — the best result here</text>

    <!-- Sonnet 5 max: bare 90 @32.75 -> doctrine 87 @38.86 -->
    <line class="link" x1="507" y1="480" x2="576" y2="585"/>
    <circle cx="507" cy="480" r="8" fill="var(--bg)" stroke="var(--sonnet)" stroke-width="2.5"/>
    <circle cx="576" cy="585" r="8" fill="var(--sonnet)"/>
    <text class="name" x="594" y="581">Sonnet 5 max</text>
    <text class="note" x="594" y="597">90 → 87 — worse with the layer, and dearer</text>

    <!-- Opus 5 max: bare 91 @36.99 -> doctrine 92 @83.75 -->
    <line class="link" x1="555" y1="445" x2="1080" y2="410"/>
    <circle cx="555" cy="445" r="8" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/>
    <circle cx="1080" cy="410" r="8" fill="var(--opus)"/>
    <text class="name" x="1080" y="386" text-anchor="middle">Opus 5 max</text>
    <text class="note" x="1080" y="402" text-anchor="middle">91 → 92, for $37 → $84</text>
    <text class="note" x="1080" y="434" text-anchor="middle">the layer let it spawn 18 agents</text>
  </g>

  <!-- legend -->
  <line class="grid" x1="50" y1="756" x2="1150" y2="756"/>
  <g>
    <circle cx="60" cy="782" r="7" fill="var(--opus)"/>
    <text class="legend" x="76" y="787">with the layer</text>
    <circle cx="205" cy="782" r="7" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/>
    <text class="legend" x="221" y="787">bare</text>
    <text class="note" x="300" y="787">One fresh Claude Code session per task per configuration, September 2026. Scored by script; blind judges for prose only.</text>
  </g>
</svg>
