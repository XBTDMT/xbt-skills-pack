<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="mt md">
  <title id="mt">The doctrine layer, measured with it and without it</title>
  <desc id="md">A scatter chart of correctness against cost for nine held-out tasks, cost on a logarithmic axis. Each model configuration appears twice, joined by a line: a filled dot with its rules layer and a hollow dot without it. Opus 5.5 medium goes from 93 correct at $10.30 bare to 96 at $11.54 with its layer. Opus 5.5 high goes from 95 at $14.94 to 98 at $13.98. Fable 5.1 low goes from 90 at $18.85 to 98 at $20.17. Fable 5.1 medium goes from 93 at $21.25 to 97 at $21.70. Opus 5 high goes from 92 at $25.17 to 97 at $27.41. Opus 5 max goes from 91 at $36.99 to 94 at $83.75, because the layer's agent opt-in spawned eighteen agents. Opus 5.5 max goes from 92 at $47.28 to 96 at $51.86 with no agents. Sonnet 5 max goes the wrong way: from 90 at $32.75 bare down to 87 at $38.86 with the layer. Figures as rescored on 22 September 2026.</desc>
  <style>
    :root { --bg:#fbfaf7; --ink:#1d1d1f; --muted:#7a7a80; --line:#e0ddd5; --grid:#edebe5;
            --opus:#3b5bdb; --fable:#b03a5b; --sonnet:#b07d2a; --o55:#6b3fa0; --link:#b8b5ad; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d;
            --opus:#7c9bff; --fable:#e0708f; --sonnet:#d9a441; --o55:#b394e6; --link:#4a4c53; }
    }
    :root[data-theme="dark"] { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d;
            --opus:#7c9bff; --fable:#e0708f; --sonnet:#d9a441; --o55:#b394e6; --link:#4a4c53; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .h { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
    .sub { font-size: 14px; fill: var(--muted); }
    .axlabel, .tick { font-size: 12.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-size: 14.5px; font-weight: 650; }
    .delta { font-size: 13.5px; font-weight: 400; fill: var(--muted); }
    .note { font-size: 12.5px; fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .link { stroke: var(--link); stroke-width: 1.5; }
    .legend { font-size: 13px; fill: var(--ink); }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="820" rx="14"/>
  <text class="h" x="50" y="52">Does the doctrine layer help? Eight configurations, nine tasks each, with the layer and without it.</text>
  <text class="sub" x="50" y="78">Each configuration appears twice, joined by a line: filled = with its rules layer, hollow = bare. Up is better, left is cheaper (cost on a log axis).</text>
  <g>
    <line class="grid" x1="140" y1="130.0" x2="1150" y2="130.0"/><text class="tick" x="126" y="134.5" text-anchor="end">100</text>
    <line class="grid" x1="140" y1="270.0" x2="1150" y2="270.0"/><text class="tick" x="126" y="274.5" text-anchor="end">96</text>
    <line class="grid" x1="140" y1="410.0" x2="1150" y2="410.0"/><text class="tick" x="126" y="414.5" text-anchor="end">92</text>
    <line class="grid" x1="140" y1="550.0" x2="1150" y2="550.0"/><text class="tick" x="126" y="554.5" text-anchor="end">88</text>
    <line class="axis" x1="140" y1="690.0" x2="1150" y2="690.0"/><text class="tick" x="126" y="694.5" text-anchor="end">84</text>
    <line class="axis" x1="140" y1="130" x2="140" y2="690"/>
    <line class="grid" x1="278.1" y1="130" x2="278.1" y2="690"/><text class="tick" x="278.1" y="714" text-anchor="middle">$10</text>
    <line class="grid" x1="546.6" y1="130" x2="546.6" y2="690"/><text class="tick" x="546.6" y="714" text-anchor="middle">$20</text>
    <line class="grid" x1="703.6" y1="130" x2="703.6" y2="690"/><text class="tick" x="703.6" y="714" text-anchor="middle">$30</text>
    <line class="grid" x1="901.4" y1="130" x2="901.4" y2="690"/><text class="tick" x="901.4" y="714" text-anchor="middle">$50</text>
    <line class="grid" x1="1083.4" y1="130" x2="1083.4" y2="690"/><text class="tick" x="1083.4" y="714" text-anchor="middle">$80</text>
    <text class="axlabel" x="140" y="112">correctness, nine tasks</text>
    <text class="axlabel" x="1150" y="736" text-anchor="end">total cost of the nine tasks, log axis</text>
  </g>
  <g>
    <!-- Opus 5.5 medium: bare 93 @10.3 -> layer 96 @11.54 -->
    <line class="link" x1="289.6" y1="375.0" x2="333.6" y2="270.0"/>
    <circle cx="289.6" cy="375.0" r="8" fill="var(--bg)" stroke="var(--o55)" stroke-width="2.5"/>
    <circle cx="333.6" cy="270.0" r="7.5" fill="var(--o55)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Opus 5.5 high: bare 95 @14.94 -> layer 98 @13.98 -->
    <line class="link" x1="433.6" y1="305.0" x2="407.9" y2="200.0"/>
    <circle cx="433.6" cy="305.0" r="8" fill="var(--bg)" stroke="var(--o55)" stroke-width="2.5"/>
    <circle cx="407.9" cy="200.0" r="7.5" fill="var(--o55)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Fable 5.1 low: bare 90 @18.85 -> layer 98 @20.17 -->
    <line class="link" x1="523.6" y1="480.0" x2="549.8" y2="200.0"/>
    <circle cx="523.6" cy="480.0" r="8" fill="var(--bg)" stroke="var(--fable)" stroke-width="2.5"/>
    <circle cx="549.8" cy="200.0" r="7.5" fill="var(--fable)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Fable 5.1 medium: bare 93 @21.25 -> layer 97 @21.7 -->
    <line class="link" x1="570.0" y1="375.0" x2="578.2" y2="235.0"/>
    <circle cx="570.0" cy="375.0" r="8" fill="var(--bg)" stroke="var(--fable)" stroke-width="2.5"/>
    <circle cx="578.2" cy="235.0" r="7.5" fill="var(--fable)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Opus 5 high: bare 92 @25.17 -> layer 97 @27.41 -->
    <line class="link" x1="635.6" y1="410.0" x2="668.6" y2="235.0"/>
    <circle cx="635.6" cy="410.0" r="8" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/>
    <circle cx="668.6" cy="235.0" r="7.5" fill="var(--opus)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Sonnet 5 max: bare 90 @32.75 -> layer 87 @38.86 -->
    <line class="link" x1="737.6" y1="480.0" x2="803.8" y2="585.0"/>
    <circle cx="737.6" cy="480.0" r="8" fill="var(--bg)" stroke="var(--sonnet)" stroke-width="2.5"/>
    <circle cx="803.8" cy="585.0" r="7.5" fill="var(--sonnet)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Opus 5 max: bare 91 @36.99 -> layer 94 @83.75 -->
    <line class="link" x1="784.7" y1="445.0" x2="1101.2" y2="340.0"/>
    <circle cx="784.7" cy="445.0" r="8" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/>
    <circle cx="1101.2" cy="340.0" r="7.5" fill="var(--opus)" stroke="var(--bg)" stroke-width="2"/>
    <!-- Opus 5.5 max: bare 92 @47.28 -> layer 96 @51.86 -->
    <line class="link" x1="879.8" y1="410.0" x2="915.6" y2="270.0"/>
    <circle cx="879.8" cy="410.0" r="8" fill="var(--bg)" stroke="var(--o55)" stroke-width="2.5"/>
    <circle cx="915.6" cy="270.0" r="7.5" fill="var(--o55)" stroke="var(--bg)" stroke-width="2"/>
    <text class="name" x="315.6" y="266.0" text-anchor="end">Opus 5.5 medium</text>
    <text class="delta" x="315.6" y="285.0" text-anchor="end">93 → 96, $12</text>
    <text class="name" x="389.9" y="205.0" text-anchor="end">Opus 5.5 high <tspan class="delta">95 → 98, $14</tspan></text>
    <text class="name" x="567.8" y="200.0" text-anchor="start">Fable 5.1 low <tspan class="delta">90 → 98, $20</tspan></text>
    <text class="name" x="596.2" y="224.0" text-anchor="start">Fable 5.1 medium <tspan class="delta">93 → 97, $22</tspan></text>
    <text class="name" x="686.6" y="254.0" text-anchor="start">Opus 5 high <tspan class="delta">92 → 97, $27</tspan></text>
    <text class="name" x="823.8" y="590.0" text-anchor="start" fill="var(--sonnet)">Sonnet 5 max <tspan class="delta" fill="var(--sonnet)">90 → 87, worse</tspan></text>
    <text class="name" x="1083.2" y="306.0" text-anchor="end">Opus 5 max <tspan class="delta">91 → 94</tspan></text>
    <text class="delta" x="1083.2" y="325.0" text-anchor="end">for $37 → $84, on 18 agents</text>
    <text class="name" x="933.6" y="260.0" text-anchor="start">Opus 5.5 max <tspan class="delta">92 → 96</tspan></text>
    <text class="delta" x="933.6" y="279.0" text-anchor="start">for $47 → $52, no agents</text>
  </g>
  <line class="grid" x1="50" y1="756" x2="1150" y2="756"/>
  <g>
    <circle cx="60" cy="782" r="7" fill="var(--opus)"/><text class="legend" x="76" y="787">with the layer</text>
    <circle cx="205" cy="782" r="7" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/><text class="legend" x="221" y="787">bare</text>
    <text class="note" x="300" y="787">One fresh Claude Code session per task per configuration, September 2026. Scored by script; blind judges for prose only.</text>
  </g>
</svg>
