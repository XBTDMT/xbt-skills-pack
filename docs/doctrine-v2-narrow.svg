<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1079" width="470" height="845.2" role="img" aria-labelledby="vnt vnd">
<title id="vnt">What the 14 September pages changed against the 13 September pages: four tasks, one session each</title>
<desc id="vnd">Rows for the two seats on four tasks of the nine-task set, each placing its 13 September doctrine page (hollow dot) and its 14 September page (filled dot) on a correctness axis. Fable 5.1 low: the engineer seat on 14 September: 86.4 at $6.46 on the 13 September page, 96.4 at $6.51 on the 14 September page (+10.0). Opus 5 high: the reviewer seat on 14 September: 96.4 at $8.99 on the 13 September page, 97.5 at $8.72 on the 14 September page (+1.1). Hollow: the 13 September page of each seat (a byte copy of the page committed on 3 September); filled: the 14 September page. Fable 5.1 low moved +10.0, all of it on the Review task, whose repeat scored 100.0 on both pages; Opus 5 high moved +1.1, less than one check on the Migrate task is worth on a four-task mean (3.6 points). One session per task per page, run 14 September 2026. On four tasks one check moves the mean by several points (one check on the Migrate task by 3.6), so the nine-task set's 3-point rule does not apply here and a gap counts only once it repeats; the Review gap did not (corrected 22 September: the earlier claim rested on a scorer defect).</desc>
