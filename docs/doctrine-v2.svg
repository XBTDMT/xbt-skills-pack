<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="vt vd">
  <title id="vt">What the second version of the rules changed</title>
  <desc id="vd">A scatter chart of correctness against cost on four held-out tasks, comparing the first version of the doctrine with the second. The engineer seat, Fable 5.1 at low effort, goes from 81.5 correct at $6.46 to 91.5 at $6.51 — nearly all of the gain coming from the code-review task. The reviewer seat, Opus 5 at high effort, is level: 96.5 at $8.99 against 97.5 at $8.72. On the review task the engineer seat found the planted defect in two of two runs with the second version and none of four runs without it.</desc>
  <style>
    :root { --bg:#fbfaf7; --ink:#1d1d1f; --muted:#7a7a80; --line:#e0ddd5; --grid:#edebe5;
            --opus:#3b5bdb; --fable:#b03a5b; --link:#b8b5ad; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d;
            --opus:#7c9bff; --fable:#e0708f; --link:#4a4c53; }
    }
    :root[data-theme="dark"] { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d;
            --opus:#7c9bff; --fable:#e0708f; --link:#4a4c53; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .h { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
    .sub { font-size: 14px; fill: var(--muted); }
    .axlabel { font-size: 12.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tick { font-size: 12.5px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-size: 14.5px; font-weight: 600; }
    .note { font-size: 12.5px; fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .link { stroke: var(--link); stroke-width: 1.5; }
    .legend { font-size: 13px; fill: var(--ink); }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="780" rx="14"/>

  <text class="h" x="50" y="52">What the second version of the rules changed — four tasks, one session each</text>
  <text class="sub" x="50" y="78">Hollow = first version, filled = second. The engineer seat gained ten points for half a cent; the reviewer seat was already there.</text>

  <g>
    <line class="grid" x1="140" y1="130" x2="1150" y2="130"/>
    <line class="grid" x1="140" y1="270" x2="1150" y2="270"/>
    <line class="grid" x1="140" y1="410" x2="1150" y2="410"/>
    <line class="grid" x1="140" y1="550" x2="1150" y2="550"/>
    <line class="axis" x1="140" y1="690" x2="1150" y2="690"/>
    <line class="axis" x1="140" y1="130" x2="140" y2="690"/>
    <text class="tick" x="126" y="135" text-anchor="end">100</text>
    <text class="tick" x="126" y="275" text-anchor="end">95</text>
    <text class="tick" x="126" y="415" text-anchor="end">90</text>
    <text class="tick" x="126" y="555" text-anchor="end">85</text>
    <text class="tick" x="126" y="695" text-anchor="end">80</text>
    <text class="axlabel" x="140" y="112">correctness, four tasks</text>
    <text class="tick" x="140" y="714" text-anchor="middle">$6</text>
    <text class="tick" x="392" y="714" text-anchor="middle">$7</text>
    <text class="tick" x="645" y="714" text-anchor="middle">$8</text>
    <text class="tick" x="897" y="714" text-anchor="middle">$9</text>
    <text class="tick" x="1150" y="714" text-anchor="middle">$10</text>
    <text class="axlabel" x="1150" y="736" text-anchor="end">total cost of the four tasks</text>
  </g>

  <g>
    <!-- engineer seat: Fable 5.1 low, v1 81.5 @6.46 -> v2 91.5 @6.51 -->
    <line class="link" x1="256" y1="648" x2="269" y2="368"/>
    <circle cx="256" cy="648" r="8" fill="var(--bg)" stroke="var(--fable)" stroke-width="2.5"/>
    <circle cx="269" cy="368" r="8" fill="var(--fable)"/>
    <text class="name" x="289" y="364">Engineer seat — Fable 5.1, low</text>
    <text class="note" x="289" y="382">81.5 → 91.5 for $6.46 → $6.51</text>
    <text class="note" x="289" y="400">nearly all of it on the code-review task:</text>
    <text class="note" x="289" y="418">it found the planted defect in 2 of 2 runs</text>
    <text class="note" x="289" y="436">with the new rules, and 0 of 4 without them</text>

    <!-- reviewer seat: Opus 5 high, v1 96.5 @8.99 -> v2 97.5 @8.72 -->
    <line class="link" x1="895" y1="228" x2="827" y2="200"/>
    <circle cx="895" cy="228" r="8" fill="var(--bg)" stroke="var(--opus)" stroke-width="2.5"/>
    <circle cx="827" cy="200" r="8" fill="var(--opus)"/>
    <text class="name" x="827" y="158" text-anchor="middle">Reviewer seat — Opus 5, high</text>
    <text class="note" x="827" y="176" text-anchor="middle">96.5 → 97.5, and slightly cheaper</text>
  </g>

  <line class="grid" x1="50" y1="756" x2="1150" y2="756"/>
  <text class="note" x="50" y="774">One session per task per version, so a point or two either way is noise; the review-task counts above are the part that repeated.</text>
</svg>
