<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1506" width="1200" height="1506" role="img" aria-labelledby="ht hd">
<title id="ht">The held-out set: eight tasks no doctrine page was written from</title>
<desc id="hd">A dot and bar chart of 15 runs in 13 rows on the eight tasks of the held-out set (Sonnet 5.5 high ran twice per row): correctness as dots, cost as bars. 7 October: the pages that ship since then, against the 29 September pages: Fable 5.1 low on the Fable page of 7 October (the cc fable seat): 94 at $11.33 (−4.2 against its control). Fable 5.1 low on the Fable page of 29 September: 98 at $11.95. Opus 5.5 high on the Opus 5.5 page of 7 October (the cc opus seat): 98 at $7.40 (±0.0 against its control). Opus 5.5 high on the Opus 5.5 page of 29 September: 98 at $7.01. 6 October: the 29 September pages against the pages before them: Fable 5.1 low on the Fable page of 29 September: 98 at $12.36 (±0.0 against its control). Fable 5.1 low on the Fable page of 15 September: 98 at $12.56. Opus 5.5 high on the Opus 5.5 page of 29 September: 98 at $8.14 (±0.0 against its control). Opus 5.5 high on the revised Opus 5.5 page of 22 September: 98 at $7.92. Opus 5.5 medium on the Opus 5.5 page of 29 September (the cc seat runs it on the 7 October page): 97 at $6.15. 6 October: Sonnet 5.5 with the Opus 5.5 page and without one: Sonnet 5.5 high on the Opus 5.5 page of 29 September, two runs: 97.9 at $4.68 and 97.9 at $4.48 (±0.0 against its control). Sonnet 5.5 high without a page, two runs (the cc sonnet seat): 97.9 at $4.72 and 97.9 at $4.02. Sonnet 5.5 max on the Opus 5.5 page of 29 September: 98 at $38.67 (+1.7 against its control). Sonnet 5.5 max without a page: 96 at $37.84. Correctness and cost for every setup that ran them, one fresh session per task, 6–7 October 2026. Hollow: the page it was set against, or without a page; filled: the newer page of a same-day pair, or alone. By the pre-registered rule a gap of 5 points or less is noise; twelve of the fifteen runs scored 97.9, shown as 98. Seat tags: the seat that has run that setup since 7 October, except cc, which runs Opus 5.5 medium on the 7 October page, measured here only on the 29 September page. The set is near its ceiling: the twelve runs at 97.9 each missed the same three checks on the one-unpushed task, so cost is what separates most setups. The pages were written from misses on the nine-task set; these eight tasks come from two other repos, built by agents that never read a page. Prose answers (the sessions-claim, review-decoys and audit-recall tasks) are judged blind; where the judge's verdict differs from the script's own count, the script alone reads: Opus 5.5 high on the Opus 5.5 page of 7 October, run 7 October: 92 (sessions-claim, review-decoys); Opus 5.5 high on the Opus 5.5 page of 29 September, run 7 October: 94 (sessions-claim); Sonnet 5.5 max without a page, run 6 October: 90 (review-decoys). Sonnet 5.5 high ran twice per setup (the recheck).</desc>
