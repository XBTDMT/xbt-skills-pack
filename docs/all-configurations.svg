<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1530" width="1400" height="1530" role="img" aria-labelledby="ft fd">
<title id="ft">Which Claude configuration is right? Nineteen setups, nine real tasks each, one fresh session per task.</title>
<desc id="fd">Nineteen Claude Code configurations on nine held-out tasks, one fresh session per task. Filled dots carry the model's own layer, hollow dots run bare, squares run Opus 5.5 under the older Opus doctrine. The lower panel zooms on the crowded cheap end between ten and thirty dollars.</desc>
<style>
:root { --bg:#fbfaf7; --ink:#1d1d1f; --muted:#7a7a80; --line:#e0ddd5; --grid:#edebe5; --link:#b8b5ad;
        --opus:#3b5bdb; --fable:#b03a5b; --sonnet:#b07d2a; --o55:#6b3fa0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d; --link:#4a4c53;
        --opus:#7c9bff; --fable:#e0708f; --sonnet:#d9a441; --o55:#b394e6; }
}
:root[data-theme="dark"] { --bg:#16171a; --ink:#ececef; --muted:#9a9aa2; --line:#34353b; --grid:#26282d; --link:#4a4c53;
        --opus:#7c9bff; --fable:#e0708f; --sonnet:#d9a441; --o55:#b394e6; }
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.bg { fill: var(--bg); } .h { font-size: 24px; font-weight: 700; letter-spacing: -0.2px; } .h2 { font-size: 17px; font-weight: 700; }
.sub { font-size: 15px; fill: var(--muted); } .tick, .axlabel { font-size: 13px; fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.name { font-size: 15px; font-weight: 650; } .delta { font-size: 14px; font-weight: 400; fill: var(--muted); } .note { font-size: 13px; fill: var(--muted); }
.grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--line); stroke-width: 1.5; } .link { stroke: var(--link); stroke-width: 1.5; } .legend { font-size: 14px; }
.zoombox { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
</style>
<rect class="bg" x="0" y="0" width="1400" height="1530" rx="14"/>
<text class="h" x="50" y="54">Which Claude configuration is right? Nineteen setups, nine real tasks each, one fresh session per task.</text>
<text class="sub" x="50" y="82">Up is better, left is cheaper. A line joins a model run bare (hollow) and with its own rules layer (filled). Squares: Opus 5.5 under the older Opus 5 doctrine. Rescored 22 September 2026.</text>
