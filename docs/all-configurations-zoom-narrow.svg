<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 2360" width="470" height="1848.7" role="img" aria-labelledby="fznt fznd">
<title id="fznt">The cheap end: the sixteen runs that cost under $30 for the nine tasks</title>
<desc id="fznd">Bars of cost, cheapest first, for the 16 runs that cost under $30 for the nine tasks, each with its correctness. Sonnet 5.5 high, without a page: $5.19, 92. Sonnet 5.5 high, without a page, first pass: $5.88, 93. Sonnet 5.5 high, Opus 5 page, first pass: $6.87, 93. Sonnet 5.5 high, with a page: $8.38, 96. Opus 5.5 medium, without a page: $10.30, 93. Opus 5.5 medium, on the Opus 5 page: $11.03, 95. Opus 5.5 medium, with a page: $11.54, 96. Opus 5.5 high, on the Opus 5 page: $13.32, 96. Opus 5.5 high, with a page: $13.98, 98. Opus 5.5 high, without a page: $14.94, 95. Fable 5.1 low, without a page: $18.85, 90. Fable 5.1 low, with a page: $20.17, 98. Fable 5.1 medium, without a page: $21.25, 93. Fable 5.1 medium, with a page: $21.70, 97. Opus 5 high, without a page: $25.17, 92. Opus 5 high, with a page: $27.41, 97. Noise: one setup run twice side by side moved by up to 2.7 points, so a gap of 3 points or less is level within noise. One fresh session per task. How the pairs ran: Sonnet 5.5 high and max (both passes) ran without and with a page side by side, task by task (Sonnet 5.5 high and max, first pass, over 30 September and 5 October); Opus 5 max on the same day, at overlapping times; Fable 5.1 low and medium and Opus 5.5 medium, high and max on the same day, one after the other; Opus 5 high without a page over 2–3 September (Oracle migrate, No-change and Wide audit on 2 September, the other six on 3 September at overlapping times with the run with a page), with one on 3 September; Sonnet 5 max (2 September without a page, 3 September with one) on different days. Runs on different days moved up to 4.2: Sonnet 5.5 max without a page scored 92.9 (its tasks split between 30 September and 5 October) and 88.7 (on 5 October), 4.2 points apart. Pages: Opus 5, Fable 5.1 and Sonnet 5 (the last on the Opus 5 page) ran the first pages on 2–3 September 2026 (rescored on 22 September); Opus 5.5 ran its 22 September page and the Opus 5 page of 15 September on 22 September; Sonnet 5.5 ran the Opus 5.5 page of 29 September on 5 October, after a first pass without a page and on the Opus 5 page on 30 September and 5 October. Opus 5.5 high, repeated on its page: 96.4 (97.6 here); medium, run again on the revised 22 September page: 95.3, 2 agents. The pages that ship since 7 October were measured only on the held-out set.</desc>
