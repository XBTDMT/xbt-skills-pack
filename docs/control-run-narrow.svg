<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1593" width="470" height="1247.8" role="img" aria-labelledby="cnt cnd">
<title id="cnt">Do the skills change outcomes? Absent, present, invoked, and redman typed</title>
<desc id="cnd">A table of counts per cell: 42 sessions of Fable 5.1 low on four tasks of the nine-task set, three runs per column, in four columns: skills absent, skills present but not called, skills invoked by the prompt, and redman typed first (two tasks). Fable 5.1 low without a doctrine page, one fresh session per task, three runs per column; the typed column ran two of the four tasks. Forty-two sessions, 22 September 2026. Review: all five planted defects found: absent 3 of 3; present 2 of 3; invoked 2 of 3; typed —. Review: a red herring flagged as a defect: absent 1 of 3; present 1 of 3; invoked 1 of 3; typed —. Close-out: all nine outcome checks: absent 3 of 3; present 3 of 3; invoked 3 of 3; typed —. Close-out: handoff and overview written, pin re-derived: absent 0 of 3; present 0 of 3; invoked 3 of 3; typed —. Oracle migrate: trap found, fixed, verified: absent 3 of 3; present 3 of 3; invoked 3 of 3; typed 3 of 3. Oracle migrate: the source of the change named: absent 1 of 3; present 1 of 3; invoked 3 of 3; typed 3 of 3. Oracle migrate: a decision record left in the repo: absent 0 of 3; present 0 of 3; invoked 3 of 3; typed 3 of 3. Oracle migrate: a redman ledger row left in the repo: absent 0 of 3; present 0 of 3; invoked 0 of 3; typed 3 of 3. Wide audit: files found of 50: absent 37 · 32 · 38; present 36 · 34 · 39; invoked 39 · 41 · 35; typed 40 · 43 · 35. Wide audit: “do not edit anything” respected: absent 3 of 3; present 3 of 3; invoked 3 of 3; typed 2 of 3. Helper agents spawned: absent 0 in 12; present 0 in 12; invoked 0 in 12; typed 0 in 6. Cost, Oracle migrate + Wide audit: absent $14.58; present $20.76; invoked $21.85; typed $25.12. Shaded rows: the counts that differ between the columns (three counts per column, files found, only when every run of one column lies above every run of another; the cost, a sum, never). ▲ marks a share better than the column to its left, ▼ a worse one. Four tasks of the nine-task set (Review, Close-out, Oracle migrate, Wide audit), counts per cell. A share of runs (k of 3, or agents in sessions) differs when it is not the same in every column. Every named skill loaded when asked (receipt 6 of 6, close-out 3 of 3, decision skill 3 of 3, redman 6 of 6 when typed). Redman's file-every-finding rule met the Wide audit task's “do not edit anything”: two sessions held the findings and said why, one filed and failed. Costs: the absent, invoked and typed columns from each session's own transcript record; the present column from /cost readouts pasted the same day. The cost row is the two tasks the typed column ran.</desc>
